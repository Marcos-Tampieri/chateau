<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f4ed">
  <meta name="description" content="Main menu">
  <title>Menu</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #27352d;
      --muted: #849087;
      --paper: #f7f4ed;
      --card: #fffefa;
      --green: #4f8068;
      --green-dark: #355f4a;
      --shadow: 0 24px 70px rgba(52, 65, 53, .09), 0 3px 12px rgba(52, 65, 53, .04);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 8% 12%, rgba(225, 216, 187, .25), transparent 32%),
        radial-gradient(ellipse at 94% 34%, rgba(207, 224, 208, .27), transparent 30%),
        var(--paper);
      font-family: 'DM Sans', ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-screen {
      width: min(100% - 40px, 420px);
      text-align: center;
      padding-bottom: 5vh;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #a19b88;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    h1 {
      margin: 0 0 45px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(38px, 7vw, 48px);
      line-height: 1.05;
      letter-spacing: -1.5px;
      font-weight: 700;
    }

    h1 span {
      color: var(--green);
      font-style: italic;
    }

    .level-btn {
      padding: 35px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid rgba(227, 226, 215, .9);
      border-radius: 21px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }

    .level-btn:hover {
      transform: translateY(-5px);
      border-color: var(--green);
      box-shadow: 0 32px 80px rgba(52, 65, 53, .12), 0 5px 15px rgba(52, 65, 53, .05);
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px;
      border-radius: 14px 14px 14px 5px;
      color: white;
      background: var(--green);
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 34px;
      font-weight: 700;
      transform: rotate(-5deg);
    }

    .level-btn strong {
      font-size: 26px;
      color: var(--green-dark);
      font-family: 'Playfair Display', Georgia, serif;
      letter-spacing: -0.5px;
    }

    .level-btn span {
      font-size: 13px;
      color: #899188;
    }

    @media (max-width: 480px) {
      .level-btn { padding: 30px 20px; }
      .brand-mark { width: 42px; height: 42px; font-size: 28px; }
      .level-btn strong { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main class="menu-screen">
    <p class="eyebrow">MAIN MENU</p>
    <h1>Choose a <span>game</span></h1>
    
    <a href="petit_vocab/" class="level-btn" aria-label="Play petit vocab">
      <div class="brand-mark" aria-hidden="true">é</div>
      <strong>petit vocab</strong>
      <span>A little French, every day</span>
    </a>
  </main>
</body>
</html>
